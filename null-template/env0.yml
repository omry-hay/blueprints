version: 1
deploy:
  steps:
    setupVariables:
      after:
        - aws sts get-caller-identity
        - aws s3 ls
    terraformPlan:
      after:
        - cat env0.auto.tfvars.json
        - cat env0.env-vars.json
        - cat env0.configurations.json
        - cat env0.system-env-vars.json
        
