version: 1
deploy:
  steps:
    setupVariables:
      after: 
        - |
            curl -s https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.2.43.zip -o awscliv2.zip
            unzip awscliv2.zip
            ./aws/install -i /opt/aws-cli -b opt/aws-cli/bin
destroy:
  onCompletion:
    - echo "destroy-onCompletion!!!"
