version: 1
deploy:
    steps:
        setupVariables:
          after:
            - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            - unzip awscliv2.zip
            - ./aws/install -i /opt/aws-cli -b /opt/bin
            - /opt/aws-cli/aws --version
            - ls /opt/aws-cli
            - echo "wow1"
destroy:
    onCompletion:
      - echo "destroy-onCompletion!!!"
