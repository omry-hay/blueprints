version: 1
deploy:
  steps:
    setupVariables:
      after: 
        - |
            curl https://awscli.amazonaws.com/awscli-2.2.1.tar.gz | tar -xz
            cd awscli-2.2.1
            ./configure --prefix=/opt/aws-cli/ --with-download-deps
            make 
            make install
destroy:
  onCompletion:
    - echo "destroy-onCompletion!!!"
