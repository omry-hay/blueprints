version: 2
deploy:
  steps:
    terraformInit:
      before:
        - name: Set OIDC 
          run: echo $ENV0_OIDC_TOKEN > web-identity-token.txt
        - name: Using AWS CLI
          run: | 
            export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \ 
            $(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::170412844252:role/env0_oidc_role" \
            --role-session-name "env0_OIDC_session" \
            --web-identity-token $ENV0_OIDC_TOKEN \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text))
            echo $AWS_ACCESS_KEY_ID >> $ENV0_ENV
            echo $AWS_SECRET_ACCESS_KEY >> $ENV0_ENV
            echo $AWS_SESSION_TOKEN >> $ENV0_ENV
      after:
        - name: Check AWS Creds
          run: |
            echo $AWS_ACCESS_KEY_ID
            echo $AWS_SECRET_ACCESS_KEY
            echo $AWS_SESSION_TOKEN
